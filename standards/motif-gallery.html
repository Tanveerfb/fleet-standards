<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motif gallery</title>
<!--
  The fleet standard's motif gallery: one sample tile per family in motifs.md, grouped as the
  catalogue is. motifs.md is the source: a family added there gets a tile here in the same
  commit, and tests/run.mjs checks every family has one.

  A tile is one motif applied to the same five pieces (a heading, a paragraph, a button, a
  card, an input), in light and in dark. Every value here is an illustration, not a token:
  a project's tokens come from its own locked mockup (rules/ui.md §DESIGN).

  To add a family: one entry in FAMILIES (name exactly as in motifs.md) and one CSS block
  `.m-<id>` setting the variables below for `.light` and `.dark`, plus any bespoke rules.
  Text on a fill follows §DESIGN: white on a saturated fill darkened until it reaches 4.5:1,
  dark text on a genuinely light fill.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Fredoka:wght@400;600&family=Orbitron:wght@500;700&family=Permanent+Marker&family=Playfair+Display:wght@500;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f6f5f2; --ink: #1c1b19; --soft: #5f5c55; --line: #dcd9d1; --panel: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #151517; --ink: #ecebe7; --soft: #a3a09a; --line: #2e2e33; --panel: #1d1d20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #151517; --ink: #ecebe7; --soft: #a3a09a; --line: #2e2e33; --panel: #1d1d20;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 28px 16px 64px; }
  .page > header h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .page > header p { margin: 0; color: var(--soft); max-width: 68ch; }
  nav.groups { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  nav.groups a {
    color: var(--ink); text-decoration: none; font-size: 0.85rem;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--panel);
  }
  nav.groups a:hover { border-color: var(--soft); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  section.group { margin-top: 36px; scroll-margin-top: 12px; }
  section.group > h2 { font-size: 1.15rem; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .tiles { display: grid; gap: 20px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }

  /* A tile: the family's name and line, then the same sample in light, then in dark. */
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tile > header { padding: 12px 16px 10px; }
  .tile > header h3 { margin: 0; font-size: 1rem; }
  .tile > header p { margin: 2px 0 0; font-size: 0.82rem; color: var(--soft); }

  /* The sample. Each motif sets these variables for .light and .dark. */
  .s {
    --hs: 1.25rem; --hw: 700; --ht: 0; --hc: none; --bw: 1px; --r: 8px; --sh: none; --bs: none;
    position: relative; background: var(--bg); color: var(--fg); font-family: var(--fb);
    padding: 20px 18px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px;
    align-items: start; min-width: 0;
  }
  .s h4, .s p { grid-column: 1 / -1; }
  .s .form { display: grid; gap: 10px; align-content: start; min-width: 0; }
  @media (max-width: 560px) { .s { grid-template-columns: 1fr; } }
  .s h4 {
    margin: 0; font-family: var(--fh); font-size: var(--hs); font-weight: var(--hw);
    letter-spacing: var(--ht); text-transform: var(--hc); line-height: 1.2;
  }
  .s p { margin: 0; font-size: 0.88rem; line-height: 1.45; color: var(--mu); }
  .s .card {
    position: relative; background: var(--cd); border: var(--bw) solid var(--bd); border-radius: var(--r);
    padding: 12px 14px; box-shadow: var(--sh); display: grid; gap: 2px;
  }
  .s .card span { font-size: 0.74rem; color: var(--cm, var(--mu)); }
  .s .card b { font-family: var(--fh); font-size: 1.4rem; font-weight: var(--hw); color: var(--cf, inherit); }
  .s label { display: grid; gap: 4px; font-size: 0.74rem; color: var(--mu); }
  .s input {
    width: 100%; min-width: 0; font: inherit; font-size: 0.86rem; color: var(--fg);
    background: var(--in, var(--cd)); border: var(--bw) solid var(--bd); border-radius: var(--r);
    padding: 9px 11px;
  }
  .s input::placeholder { color: var(--mu); opacity: 0.85; }
  .s button {
    justify-self: start; font: inherit; font-family: var(--fh); font-size: 0.86rem; font-weight: 700;
    letter-spacing: var(--ht); text-transform: var(--hc); cursor: pointer;
    color: var(--oa); background: var(--ac); border: var(--bw) solid var(--bb, var(--ac));
    border-radius: var(--br, var(--r)); padding: 9px 16px; box-shadow: var(--bs);
  }
  @media (prefers-reduced-motion: no-preference) { .s button { transition: transform 0.12s, box-shadow 0.12s; } }

  /* ================================================================ Paper and craft */
  .m-stationery .s { --fh: "Caveat", "Segoe Print", cursive; --fb: Georgia, "Times New Roman", serif; --hs: 1.8rem; --r: 3px; }
  .m-stationery .light { --bg: #fbf7ea; --fg: #2b2a26; --mu: #5d5a50; --cd: #fff6b3; --bd: #d9cf9a; --in: #fffdf4; --ac: #1f4e8c; --oa: #fff; --sh: 2px 3px 0 rgba(60, 50, 20, 0.18); background-image: repeating-linear-gradient(#fbf7ea 0 23px, #cfdcf0 23px 24px); }
  .m-stationery .dark { --bg: #25241f; --fg: #f1ead6; --mu: #b9b199; --cd: #4a4526; --bd: #6b6436; --in: #2e2d27; --ac: #f2d15c; --oa: #25241f; --sh: 2px 3px 0 rgba(0, 0, 0, 0.4); background-image: repeating-linear-gradient(#25241f 0 23px, #34352f 23px 24px); }
  .m-stationery .card { transform: rotate(-1.2deg); }
  .m-stationery .card::before { content: ""; position: absolute; top: -8px; left: 50%; width: 54px; height: 16px; margin-left: -27px; background: rgba(150, 190, 220, 0.55); transform: rotate(2deg); }
  .m-stationery h4 { text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 4px; }

  .m-classroom .s { --fh: "Caveat", "Segoe Print", cursive; --fb: "Trebuchet MS", Verdana, sans-serif; --hs: 1.8rem; --r: 4px; }
  .m-classroom .light { --bg: #fdfdfb; --fg: #1f2a37; --mu: #4a5563; --cd: #fff; --bd: #c9ced6; --ac: #1d4ed8; --oa: #fff; --bw: 2px; box-shadow: inset 0 0 0 6px #d5d9df; }
  .m-classroom .dark { --bg: #23402f; --fg: #f3f1e7; --mu: #cfdccf; --cd: transparent; --bd: #e8e6da; --in: transparent; --ac: #f3f1e7; --oa: #23402f; --bw: 2px; box-shadow: inset 0 0 0 6px #7a5a3a; }
  .m-classroom .dark .card, .m-classroom .dark input { border-style: dashed; }
  .m-classroom .card b::after { content: " ★"; color: #d49a00; }
  .m-classroom .dark .card b::after { color: #ffd54a; }

  .m-scrapbook .s { --fh: "Caveat", "Segoe Print", cursive; --fb: Georgia, serif; --hs: 1.8rem; --r: 2px; --cf: #2b2622; --cm: #5d564c; }
  .m-scrapbook .light { --bg: #e9dcc3; --fg: #2b2622; --mu: #55493a; --cd: #fff; --bd: #fff; --in: #f7f0e2; --ac: #b4232a; --oa: #fff; --sh: 0 6px 14px rgba(60, 40, 10, 0.28); }
  .m-scrapbook .dark { --bg: #2b2622; --fg: #f3ede2; --mu: #c7bca9; --cd: #f3ede2; --bd: #f3ede2; --in: #3a342f; --ac: #f0b23e; --oa: #2b2622; --sh: 0 6px 14px rgba(0, 0, 0, 0.5); }
  .m-scrapbook .card { border-width: 6px 6px 18px; transform: rotate(1.6deg); }
  .m-scrapbook .card::before { content: ""; position: absolute; top: -14px; left: 16px; width: 60px; height: 18px; background: rgba(240, 178, 62, 0.75); transform: rotate(-6deg); }
  .m-scrapbook h4 { justify-self: start; padding: 0 8px; background: linear-gradient(transparent 55%, rgba(240, 178, 62, 0.55) 55%); }
  .m-scrapbook input { border-style: dashed; border-color: var(--mu); }

  .m-papercraft .s { --fh: "Fredoka", "Trebuchet MS", sans-serif; --fb: "Fredoka", "Trebuchet MS", sans-serif; --r: 14px; --bw: 0px; }
  .m-papercraft .light { --bg: #dfeae6; --fg: #23383a; --mu: #46605f; --cd: #fff; --bd: transparent; --ac: #b8364a; --oa: #fff; --sh: 0 2px 0 #c4d5d0, 0 5px 0 #b3c7c1, 0 12px 16px rgba(30, 60, 55, 0.18); --bs: 0 3px 0 #8a2536; }
  .m-papercraft .dark { --bg: #1e2a33; --fg: #eef4f2; --mu: #b3c4c2; --cd: #2c3d49; --bd: transparent; --in: #26343f; --ac: #f2a65a; --oa: #1e2a33; --sh: 0 2px 0 #24323d, 0 5px 0 #1a252d, 0 12px 16px rgba(0, 0, 0, 0.4); --bs: 0 3px 0 #b7742f; }
  .m-papercraft input { box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.12); }

  .m-risograph .s { --fh: "Space Grotesk", Arial, sans-serif; --fb: "Space Grotesk", Arial, sans-serif; --r: 0; --bw: 2px; --hs: 1.45rem; }
  .m-risograph .light { --bg: #f4efe4; --fg: #1b2a6b; --mu: #2f3d7c; --cd: #ffe14d; --bd: #1b2a6b; --in: #f4efe4; --ac: #1b2a6b; --oa: #fff; --sh: 5px 5px 0 #ff6b8a; --bs: 3px 3px 0 #ff6b8a; }
  .m-risograph .dark { --bg: #151a3a; --fg: #f4efe4; --mu: #cfd3ee; --cd: #ff6b8a; --bd: #f4efe4; --cf: #151a3a; --cm: #151a3a; --in: #151a3a; --ac: #ffe14d; --oa: #151a3a; --sh: 5px 5px 0 #ffe14d; --bs: 3px 3px 0 #ff6b8a; }
  .m-risograph .s::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.35; background-image: radial-gradient(rgba(0, 0, 0, 0.35) 0.6px, transparent 0.7px); background-size: 4px 4px; mix-blend-mode: multiply; }
  .m-risograph .dark::after { background-image: radial-gradient(rgba(255, 255, 255, 0.25) 0.6px, transparent 0.7px); mix-blend-mode: screen; }

  /* ================================================================ Soft and tactile */
  .m-claymorphism .s { --fh: "Fredoka", "Trebuchet MS", sans-serif; --fb: "Fredoka", "Trebuchet MS", sans-serif; --r: 22px; --br: 999px; --bw: 0px; }
  .m-claymorphism .light { --bg: #e6e1ff; --fg: #2c2552; --mu: #554c85; --cd: #f6f4ff; --bd: transparent; --ac: #6d4fd8; --oa: #fff; --sh: 8px 8px 16px rgba(110, 90, 200, 0.28), inset -4px -4px 8px rgba(110, 90, 200, 0.2), inset 4px 4px 8px #fff; --bs: 4px 6px 12px rgba(80, 50, 190, 0.4), inset -3px -3px 6px rgba(0, 0, 0, 0.2), inset 3px 3px 6px rgba(255, 255, 255, 0.35); }
  .m-claymorphism .dark { --bg: #23203a; --fg: #f0edff; --mu: #bdb6e6; --cd: #302c50; --bd: transparent; --ac: #b9a6ff; --oa: #23203a; --sh: 8px 8px 16px rgba(0, 0, 0, 0.45), inset 3px 3px 6px rgba(255, 255, 255, 0.07), inset -3px -3px 6px rgba(0, 0, 0, 0.35); --bs: 4px 6px 12px rgba(0, 0, 0, 0.5), inset -3px -3px 6px rgba(0, 0, 0, 0.25), inset 3px 3px 6px rgba(255, 255, 255, 0.4); }
  .m-claymorphism input { box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.14), inset -2px -2px 5px rgba(255, 255, 255, 0.25); }
  .m-claymorphism button:active { transform: scale(0.96); }

  .m-neumorphism .s { --fh: system-ui, "Segoe UI", sans-serif; --fb: system-ui, "Segoe UI", sans-serif; --r: 14px; --bw: 0px; --hw: 600; }
  .m-neumorphism .light { --bg: #e6e9ef; --fg: #2f3a4a; --mu: #56627a; --cd: #e6e9ef; --bd: transparent; --ac: #e6e9ef; --oa: #1f4fb0; --sh: 6px 6px 12px #c3c8d1, -6px -6px 12px #fff; --bs: 5px 5px 10px #c3c8d1, -5px -5px 10px #fff; }
  .m-neumorphism .dark { --bg: #2a2d34; --fg: #e3e6ec; --mu: #aab1bf; --cd: #2a2d34; --bd: transparent; --ac: #2a2d34; --oa: #9cc0ff; --sh: 6px 6px 12px #1e2025, -6px -6px 12px #363a43; --bs: 5px 5px 10px #1e2025, -5px -5px 10px #363a43; }
  .m-neumorphism .light input { box-shadow: inset 4px 4px 8px #c3c8d1, inset -4px -4px 8px #fff; }
  .m-neumorphism .dark input { box-shadow: inset 4px 4px 8px #1e2025, inset -4px -4px 8px #363a43; }
  .m-neumorphism .light button:active { box-shadow: inset 4px 4px 8px #c3c8d1, inset -4px -4px 8px #fff; }
  .m-neumorphism .dark button:active { box-shadow: inset 4px 4px 8px #1e2025, inset -4px -4px 8px #363a43; }

  .m-glassmorphism .s { --fh: system-ui, "Segoe UI", sans-serif; --fb: system-ui, "Segoe UI", sans-serif; --r: 16px; --hw: 600; }
  .m-glassmorphism .light { --bg: #9db8ff; --fg: #14183a; --mu: #252a57; --cd: rgba(255, 255, 255, 0.38); --bd: rgba(255, 255, 255, 0.7); --ac: #14183a; --oa: #fff; --sh: 0 8px 24px rgba(40, 30, 110, 0.18); background-image: radial-gradient(circle at 15% 20%, #c9f0ff 0 18%, transparent 40%), radial-gradient(circle at 85% 80%, #ffb3d6 0 20%, transparent 45%), linear-gradient(135deg, #8fb0ff, #c9a2ff); }
  .m-glassmorphism .dark { --bg: #1b1f4a; --fg: #fff; --mu: #dadcf7; --cd: rgba(255, 255, 255, 0.1); --bd: rgba(255, 255, 255, 0.28); --ac: #fff; --oa: #1b1f4a; --sh: 0 8px 24px rgba(0, 0, 0, 0.35); background-image: radial-gradient(circle at 15% 20%, #2a6a9c 0 14%, transparent 40%), radial-gradient(circle at 85% 80%, #8a2a7c 0 16%, transparent 45%), linear-gradient(135deg, #1b1f4a, #3a1d6e); }
  .m-glassmorphism .card, .m-glassmorphism input { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .m-tactile-hardware .s { --fh: "Orbitron", Consolas, monospace; --fb: "Trebuchet MS", Verdana, sans-serif; --r: 6px; --hs: 1rem; --ht: 0.08em; --hc: uppercase; --cd: #14171a; --bd: #000; --bw: 2px; }
  .m-tactile-hardware .light { --bg: #d6d3cb; --fg: #1f2023; --mu: #45474c; --cf: #ffb347; --cm: #d99a3d; --in: #f1efe9; --ac: #ecebe6; --oa: #1f2023; --bb: #8a867c; --bs: 0 4px 0 #8a867c, 0 6px 8px rgba(0, 0, 0, 0.2); --sh: inset 0 2px 6px rgba(0, 0, 0, 0.8); background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 3px); }
  .m-tactile-hardware .dark { --bg: #2a2c2f; --fg: #e8e6e0; --mu: #b3b1ab; --cf: #7dffb0; --cm: #4fc486; --in: #1c1e20; --ac: #4a4d52; --oa: #fff; --bb: #17181a; --bs: 0 4px 0 #17181a, 0 6px 8px rgba(0, 0, 0, 0.4); --sh: inset 0 2px 6px rgba(0, 0, 0, 0.9); background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 3px); }
  .m-tactile-hardware input { border-color: #8a867c; }
  .m-tactile-hardware button:active { transform: translateY(4px); box-shadow: none; }
  .m-tactile-hardware h4::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #2fd16b; box-shadow: 0 0 6px #2fd16b; }

  .m-cozy-storybook .s { --fh: Georgia, "Times New Roman", serif; --fb: Georgia, "Times New Roman", serif; --r: 18px; --br: 999px; --bw: 2px; --hs: 1.4rem; }
  .m-cozy-storybook .light { --bg: #fbf1df; --fg: #4a3426; --mu: #6d5443; --cd: #fffaf0; --bd: #e2c9a0; --ac: #a84a22; --oa: #fff; }
  .m-cozy-storybook .dark { --bg: #2d2320; --fg: #f6e7d2; --mu: #cdb9a2; --cd: #3a2e29; --bd: #6b5444; --ac: #f0b27a; --oa: #2d2320; }
  .m-cozy-storybook h4 { font-style: italic; }
  .m-cozy-storybook .s p::first-letter { font-size: 1.9em; float: left; line-height: 0.9; padding-right: 5px; color: var(--ac); font-weight: 700; }
  .m-cozy-storybook .card { border-style: dashed; }

  /* ================================================================ Bold and graphic */
  .m-neo-brutalism .s { --fh: "Space Grotesk", Arial, sans-serif; --fb: "Space Grotesk", Arial, sans-serif; --bw: 3px; --r: 0; --hs: 1.45rem; }
  .m-neo-brutalism .light { --bg: #fffbe6; --fg: #111; --mu: #333; --cd: #ffd23f; --bd: #111; --ac: #2b59ff; --oa: #fff; --bb: #111; --in: #fff; --sh: 6px 6px 0 #111; --bs: 4px 4px 0 #111; }
  .m-neo-brutalism .dark { --bg: #17171a; --fg: #fff; --mu: #d6d6d6; --cd: #2b59ff; --bd: #fff; --cm: #fff; --ac: #ffd23f; --oa: #111; --bb: #fff; --in: #000; --sh: 6px 6px 0 #fff; --bs: 4px 4px 0 #fff; }
  .m-neo-brutalism button:active { transform: translate(4px, 4px); box-shadow: none; }

  .m-comic-book-pop-art .s { --fh: "Bangers", Impact, sans-serif; --fb: "Trebuchet MS", Verdana, sans-serif; --bw: 3px; --r: 18px; --br: 4px; --hs: 1.7rem; --hw: 400; --ht: 0.04em; --cd: #fff; --cf: #111; --cm: #333; }
  .m-comic-book-pop-art .light { --bg: #ffe45c; --fg: #111; --mu: #222; --bd: #111; --ac: #d81f26; --oa: #fff; --bb: #111; --in: #fff; --bs: 3px 3px 0 #111; background-image: radial-gradient(rgba(0, 0, 0, 0.13) 1.3px, transparent 1.4px); background-size: 9px 9px; }
  .m-comic-book-pop-art .dark { --bg: #1a1a40; --fg: #fff; --mu: #e4e4f5; --bd: #fff; --ac: #ffd400; --oa: #111; --bb: #fff; --in: #0e0e2a; --bs: 3px 3px 0 #fff; background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1.3px, transparent 1.4px); background-size: 9px 9px; }
  .m-comic-book-pop-art .card { border-color: #111; margin-bottom: 12px; }
  .m-comic-book-pop-art .card::after { content: ""; position: absolute; left: 26px; bottom: -15px; width: 20px; height: 20px; background: #fff; border-right: 3px solid #111; border-bottom: 3px solid #111; transform: skew(28deg) rotate(38deg); }
  .m-comic-book-pop-art .light h4 { text-shadow: 2px 2px 0 #fff; }

  .m-shonen-ink .s { --fh: "Bangers", Impact, sans-serif; --fb: "Trebuchet MS", Verdana, sans-serif; --bw: 3px; --r: 0; --hs: 1.8rem; --hw: 400; --ht: 0.03em; --hc: uppercase; }
  .m-shonen-ink .light { --bg: #fff; --fg: #000; --mu: #2b2b2b; --cd: #fff; --bd: #000; --ac: #000; --oa: #fff; background-image: repeating-linear-gradient(98deg, transparent 0 13px, rgba(0, 0, 0, 0.07) 13px 14px); }
  .m-shonen-ink .dark { --bg: #0c0c0c; --fg: #fff; --mu: #dcdcdc; --cd: #0c0c0c; --bd: #fff; --ac: #fff; --oa: #000; background-image: repeating-linear-gradient(98deg, transparent 0 13px, rgba(255, 255, 255, 0.09) 13px 14px); }
  .m-shonen-ink h4 { transform: skewX(-8deg); transform-origin: left; }
  .m-shonen-ink .card { overflow: hidden; }
  .m-shonen-ink .card::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 34%; opacity: 0.5; background-image: radial-gradient(currentColor 1px, transparent 1.2px); background-size: 6px 6px; -webkit-mask-image: linear-gradient(90deg, transparent, #000); mask-image: linear-gradient(90deg, transparent, #000); }
  .m-shonen-ink button { transform: skewX(-8deg); }

  .m-accessibility-first button { font-size: 1rem; padding: 13px 20px; text-decoration: underline; }

  .m-consumer-warm .s { --fh: "Fredoka", "Trebuchet MS", sans-serif; --fb: "Trebuchet MS", Verdana, sans-serif; --r: 16px; --br: 999px; --hs: 1.4rem; --hw: 600; }
  .m-consumer-warm .light { --bg: #fff6ee; --fg: #3a2a22; --mu: #66524a; --cd: #fff; --bd: #f1dccb; --ac: #b93d0b; --oa: #fff; --sh: 0 6px 16px rgba(180, 120, 80, 0.16); }
  .m-consumer-warm .dark { --bg: #2a211d; --fg: #fdeee2; --mu: #d2bcae; --cd: #372c27; --bd: #4d3e37; --ac: #ffb38a; --oa: #2a211d; --sh: 0 6px 16px rgba(0, 0, 0, 0.35); }

  .m-clean-saas .s { --fh: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --fb: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --r: 8px; --hs: 1.2rem; --hw: 600; }
  .m-clean-saas .light { --bg: #f7f8fa; --fg: #111827; --mu: #4b5563; --cd: #fff; --bd: #e5e7eb; --ac: #2563eb; --oa: #fff; --sh: 0 1px 2px rgba(0, 0, 0, 0.06); }
  .m-clean-saas .dark { --bg: #0f1218; --fg: #f3f4f6; --mu: #9ca3af; --cd: #171b23; --bd: #2a303c; --ac: #2563eb; --oa: #fff; --sh: 0 1px 2px rgba(0, 0, 0, 0.4); }
  .m-clean-saas .card b::after { content: "▲ 12%"; margin-left: 8px; font-size: 0.72rem; font-weight: 600; color: #15803d; vertical-align: middle; }
  .m-clean-saas .dark .card b::after { color: #4ade80; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Motif gallery</h1>
    <p>One tile for each family in the catalogue. Every tile is the same five pieces, a
      heading, a paragraph, a button, a card and an input, in light and in dark, so the
      motif is the only thing that changes. Values are illustrations, not tokens.</p>
  </header>
  <nav class="groups" aria-label="Groups"></nav>
  <main id="gallery"><noscript>This page draws its tiles with a script. Turn scripts on, or read the catalogue in motifs.md.</noscript></main>
</div>

<script>
  // One entry per family in motifs.md: the name exactly as written there, its group, and a
  // few words from its entry. The CSS class is `.m-<slug of the name>`.
  const FAMILIES = [
    { name: "Stationery", group: "Paper and craft", line: "Paper, pencil marks, sticky notes, tape" },
    { name: "Classroom", group: "Paper and craft", line: "Boards, gold stars, pinned notices" },
    { name: "Scrapbook", group: "Paper and craft", line: "Torn paper, photos, tape, layered cut-outs" },
    { name: "Papercraft", group: "Paper and craft", line: "Layered cut paper, depth from stacked sheets" },
    { name: "Risograph", group: "Paper and craft", line: "Two or three inks overprinted, visible grain" },
    { name: "Claymorphism", group: "Soft and tactile", line: "Puffy rounded shapes, a squish on press" },
    { name: "Neumorphism", group: "Soft and tactile", line: "Surfaces extruded and pressed from the background" },
    { name: "Glassmorphism", group: "Soft and tactile", line: "Frosted translucent layers over colour" },
    { name: "Tactile hardware", group: "Soft and tactile", line: "Knobs, switches, readouts, device detailing" },
    { name: "Cozy storybook", group: "Soft and tactile", line: "Hand-made illustration, rounded serifs, warm and gentle" },
    { name: "Neo-brutalism", group: "Bold and graphic", line: "Thick borders, hard offset shadows, flat blocks" },
    { name: "Comic book / pop art", group: "Bold and graphic", line: "Halftone dots, speech bubbles, bold primaries" },
    { name: "Shonen ink", group: "Bold and graphic", line: "Bold ink lines, screentone, speed lines" },
    { name: "Maximalism", group: "Bold and graphic", line: "Layered patterns, clashing colour, dense ornament" },
    { name: "Streetwear / graffiti", group: "Bold and graphic", line: "Spray paint, tags, stickers, bold drops" },
    { name: "Memphis", group: "Retro and nostalgic", line: "Squiggles, confetti shapes, clashing pastels" },
    { name: "Retro pixel", group: "Retro and nostalgic", line: "Pixel fonts, chunky bordered UI, limited palettes" },
    { name: "Retro desktop", group: "Retro and nostalgic", line: "Windows, title bars and bevels of an old operating system" },
    { name: "Synthwave", group: "Retro and nostalgic", line: "Retro-futurist glow, gradients and grids" },
    { name: "Mid-century modern", group: "Retro and nostalgic", line: "Starbursts, boomerang shapes, teal and orange" },
    { name: "Heritage", group: "Retro and nostalgic", line: "Period styles: classical, ornate, historic" },
    { name: "Cyberpunk", group: "Dark and techy", line: "Near-black base, neon signal colour, angular shapes" },
    { name: "Terminal", group: "Dark and techy", line: "Monospace, prompts and cursors, text-mode framing" },
    { name: "Sci-fi HUD", group: "Dark and techy", line: "Thin linework, brackets and corner marks, readouts" },
    { name: "Industrial", group: "Dark and techy", line: "Utilitarian type, signal colours, stencils" },
    { name: "Space", group: "Dark and techy", line: "Starfields, orbit lines, deep dark gradients" },
    { name: "Minimalist", group: "Calm and refined", line: "Whitespace, a strong type scale, one accent" },
    { name: "Japandi", group: "Calm and refined", line: "Muted natural tones, lots of space, quiet type" },
    { name: "Art deco", group: "Calm and refined", line: "Gold linework, geometric frames, symmetry" },
    { name: "Dreamlike", group: "Calm and refined", line: "Soft light, floating forms" },
    { name: "Academia", group: "Calm and refined", line: "Libraries, leather, serif type, candlelight" },
    { name: "Organic", group: "Calm and refined", line: "Earthy colour, grain, soft curves" },
    { name: "Accessibility-first", group: "Institutional and product", line: "High contrast, large targets, plain language" },
    { name: "Consumer-warm", group: "Institutional and product", line: "Friendly rounded type, warm neutrals" },
    { name: "Clean SaaS", group: "Institutional and product", line: "Neutral greys, one brand colour, crisp cards" },
  ];

  const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  const sample = (scheme) => `
    <div class="s ${scheme}">
      <h4>Weekly summary</h4>
      <p>Three invoices went out this week, and two of them are paid.</p>
      <div class="card"><span>Paid so far</span><b>$1,240</b><span>2 of 3 invoices</span></div>
      <div class="form">
        <label>Client name<input type="text" placeholder="Start typing" autocomplete="off"></label>
        <button type="button">Send reminder</button>
      </div>
    </div>`;

  const groups = [...new Set(FAMILIES.map((f) => f.group))];
  document.querySelector("nav.groups").innerHTML = groups.map((g) => `<a href="#${slug(g)}">${g}</a>`).join("");
  document.getElementById("gallery").innerHTML = groups
    .map(
      (g) => `
    <section class="group" id="${slug(g)}">
      <h2>${g}</h2>
      <div class="tiles">${FAMILIES.filter((f) => f.group === g)
        .map(
          (f) => `
        <article class="tile m-${slug(f.name)}" data-family="${f.name}">
          <header><h3>${f.name}</h3><p>${f.line}</p></header>
          ${sample("light")}${sample("dark")}
        </article>`,
        )
        .join("")}</div>
    </section>`,
    )
    .join("");
</script>
</body>
</html>
